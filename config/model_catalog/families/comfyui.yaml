          min: 5
          max: 15
          step: 1
          default: 5
        params:
          seed: true
        inputs:
          reference_images:
            max: 3
            reference_type: video

  # ── Wan VACE video (R2V) ───────────────────────────────────────────
  - id: comfyui/comfyui-wan-vace-video
    display_name: ComfyUI Wan VACE 14B 视频
    description: 本地 Wan VACE 14B 参考生视频（平铺工作流，可转换）
    status: active
    release_stage: local
    docs:
      context_hub_doc_ids: [comfyui/workflows]
    modes:
      r2v:
        legacy_id: comfyui-wan-vace-r2v
        display_name: ComfyUI Wan VACE 14B R2V
        description: 参考图/视频混合引导的参考生视频
        capabilities: [r2v]
        ui:
          selection_group: r2v
