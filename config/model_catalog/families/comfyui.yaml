family: comfyui
display_name: "ComfyUI (本地)"
provider: local
routing_prefixes:
  - comfyui/
  - comfyui-
supported_backends:
  - comfyui
default_backend: comfyui
credential_sources:
  comfyui:
    - COMFYUI_BASE_URL
supported_modalities:
  - t2i
  - i2i
  - image
  - i2v
  - r2v
  - t2v
transport:
  image_input_mode:
    comfyui: comfyui_local_upload
  audio_input_mode:
    comfyui: comfyui_local_upload
  reference_video_input_mode:
    comfyui: comfyui_local_upload
docs:
  official_snapshot_ids:
    - comfyui/2026-08-30
models:
  # ── Flux 2 Klein 4B image (T2I / I2I) ─────────────────────────────
  - id: comfyui/comfyui-flux2-klein-image
    display_name: ComfyUI Flux 2 Klein 图像
    description: 本地 Flux 2 Klein 4B 文生图/图生图（轻量快速，3090 友好）
    status: active
    release_stage: local
    docs:
      context_hub_doc_ids: [comfyui/workflows]
    modes:
      t2i:
        legacy_id: comfyui-flux2-klein-t2i
        display_name: ComfyUI Flux 2 Klein T2I
        description: 本地文生图（Flux 2 Klein 4B）
        capabilities: [t2i]
        ui:
          selection_group: t2i
          visible_in: [project_settings, series_settings, global_settings]
          order: 200
          badges: [local]
        params:
          size:
            options: ["1024*1024", "1024*576", "576*1024", "1152*896", "896*1152"]
            default: "1024*1024"
          seed: true
      i2i:
        legacy_id: comfyui-flux2-klein-i2i
        display_name: ComfyUI Flux 2 Klein I2I
        description: 本地图生图（Flux 2 Klein 4B Edit）
        capabilities: [i2i]
        ui:
          selection_group: i2i
          visible_in: [project_settings, series_settings, global_settings]
          order: 200
          badges: [local]
        params:
          size:
            options: ["1024*1024", "1024*576", "576*1024", "1152*896", "896*1152"]
            default: "1024*1024"
          seed: true
        inputs:
          reference_images:
            max: 1
      image:
        legacy_id: comfyui-flux2-klein-image
        display_name: ComfyUI Flux 2 Klein Image
        description: 本地图像生成（T2I/I2I 通用）
        capabilities: [t2i, i2i]
        ui:
          selection_group: image
          visible_in: [project_settings, series_settings, global_settings]
          order: 200
          badges: [local]
        params:
          size:
            options: ["1024*1024", "1024*576", "576*1024", "1152*896", "896*1152"]
            default: "1024*1024"
          seed: true
        inputs:
          reference_images:
            max: 1

  # ── MiniMax H3 video (I2V / R2V / T2V) ────────────────────────────
  - id: comfyui/comfyui-minimax-h3-video
    display_name: ComfyUI MiniMax H3 视频
    description: 本地 MiniMax H3（int8）图生视频/参考生视频/文生视频，2K + 原生音轨
    status: active
    release_stage: local
    docs:
      context_hub_doc_ids: [comfyui/workflows]
    modes:
      i2v:
        legacy_id: comfyui-h3-i2v
        display_name: ComfyUI MiniMax H3 I2V
        description: 首帧图生视频（FL2VA int8）
        capabilities: [i2v]
        ui:
          selection_group: i2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 180
          badges: [local]
        duration:
          type: slider
          min: 5
          max: 15
          step: 1
          default: 5
        params:
          seed: true
        inputs:
          reference_images:
            max: 1
            reference_type: image
      r2v:
        legacy_id: comfyui-h3-r2v
        display_name: ComfyUI MiniMax H3 R2V
        description: 多模态参考生视频（图/视频/音频，Ref2VA int8）
        capabilities: [r2v]
        ui:
          selection_group: r2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 180
          badges: [local]
        duration:
          type: slider
          min: 5
          max: 15
          step: 1
          default: 5
        params:
          seed: true
        inputs:
          reference_images:
            max: 3
            reference_type: video
      t2v:
        legacy_id: comfyui-h3-t2v
        display_name: ComfyUI MiniMax H3 T2V
        description: 文生视频（复用 FL2VA int8，无需额外权重）
        capabilities: [t2v]
        ui:
          selection_group: t2v
          visible_in: [project_settings, series_settings, global_settings]
          order: 180
          badges: [local]
        duration:
          type: slider
          min: 5
          max: 15
          step: 1
          default: 5
        params:
          seed: true
