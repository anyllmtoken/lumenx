          selection_group: i2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 180
          badges: [local]
        duration:
          type: slider
          min: 5
          max: 15
          step: 1
          default: 5
        params:
          seed: true
        inputs:
          reference_images:
            max: 1
            reference_type: image
      r2v:
