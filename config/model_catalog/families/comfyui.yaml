          size:
            options: ["1024*1024", "1328*1328", "832*1216", "1216*832"]
            default: "1024*1024"
          seed: true

  # ── MiniMax H3 video (I2V / R2V) ──────────────────────────────────
  - id: comfyui/comfyui-minimax-h3-video
    display_name: ComfyUI MiniMax H3 视频
    description: 本地 MiniMax H3（int8）图生视频/参考生视频，2K + 原生音轨
    status: active
    release_stage: local
    docs:
